<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoonBite | Gallery</title>


    <link rel="stylesheet" href="./css/moonbite-base.css" />
    <link rel="stylesheet" href="./css/moonbite-flexbox.css" />
    <link rel="stylesheet" href="./css/moonbite-gallery.css" />

    <script src="./js/main.js" defer></script>
    <script src="./js/gallery.js" defer></script>
  </head>
  <body>
 
    <header class="navbar">
      <div class="logo">🍴 <span class="logo-text">Moon<span class="logo-accent">Bite</span></span></div>

      <nav>
        <ul class="nav-links">
          <li><a href="./index.html" class="nav-link">Home</a></li>
          <li><a href="./menu.html" class="nav-link">Menu</a></li>
          <li><a href="./gallery.html" class="nav-link active">Gallery</a></li>
          <li><a href="./about.html" class="nav-link">About</a></li>
          <li><a href="./contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <a href="./contact.html" class="btn btn--book">Book a Table</a>

      <button id = "theme" class = "theme-change" aria-label = "Switch to light mode">☀</button>

      <button class="hamburger" id="hamburger">☰</button>
    </header>

    <main>

      <header class="section-header">
        <p class="section-label">GALLERY</p>
        <h1 class="section-title">Moments at <span class="logo-accent">MoonBite</span></h1>
        <p class="section-desc">
          Take a look at some of our favourite dishes, cozy ambiance and happy moments shared by our guests.
        </p>
      </header>

      <section class="gallery-grid">
        <img src="./images/gallery-pasta.png" alt="Pasta dish" class="gallery-img" />
        <img src="./images/gallery-interior-1.png" alt="Restaurant interior with warm lights" class="gallery-img" />
        <img src="./images/gallery-burger.png" alt="Burger and fries" class="gallery-img" />
        <img src="./images/gallery-cake.png" alt="Chocolate dessert" class="gallery-img" />
        <img src="./images/gallery-drink.png" alt="Orange cocktail drink" class="gallery-img" />
        <img src="./images/gallery-interior-2.png" alt="Candle lit dining table" class="gallery-img" />
      </section>
    </main>

  
    <footer><div class="footer">
     
      <p class="copyright">© 2026 MoonBite. All rights reserved.</p>
    </div></footer>
  </body>
</html>
